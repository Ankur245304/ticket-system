services:
  postgres:
    image: postgres:16-alpine
    container_name: support-ticket-postgres
    environment:
      POSTGRES_DB: support_ticket
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
